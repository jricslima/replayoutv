<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
               -moz-box-sizing: border-box;
                    box-sizing: border-box;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: table;
            width: 100%;
            text-align: center;
        }

        .container {
            display: table-cell;
            vertical-align: middle;
            padding: 20px;
        }

        .card {
            background-color: #1a1a24;
            border: 1px solid #2d2d3f;
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 48px;
            line-height: 1;
            margin-bottom: 20px;
            color: #e50914;
        }

        h1 {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        p {
            color: #a0a0b0;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="icon">&#9888;</div>
            <h1>Indisponível por tempo indeterminado!</h1>
            <p>Agradecemos a sua compreensão.</p>
        </div>
    </div>

</body>
</html>
